name: 自动更新竞对资讯

on:
  schedule:
    - cron: '0 18 * * *'  # 北京时间凌晨2点（UTC 18:00）
  workflow_dispatch:
  repository_dispatch:
    types: [run-now]  # 允许用只有 contents:write 的 PAT 手动触发

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 抓取竞对资讯
        run: python scripts/fetch-news.py

      - name: 注入竞对资讯到 script.js
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python scripts/inject-news.py

      # VOS / 运价 / pn15 三块数据原本由浏览器直连 raw.githubusercontent.com 读取，
      # 国内访问经常失败：VOS 有兜底但快照停在 2026-07-01（于是「我看 10 月、同事看 6 月」），
      # 运价和 pn15 连兜底都没有，直接空白。runner 访问 raw 没问题，所以每天在这里同步一份
      # 到本仓库，由 GitHub Pages 同源提供，谁打开都是同一份当天数据。
      # 资讯生成挂掉不应该连带把数据同步也跳过：这是两件独立的事。
      # 2026-10-17 实测过一次：inject 失败 → 同步和提交被 skip → 运价/pn15 的兜底文件
      # 迟迟没生成，页面只能继续回退远程。所以这步和下面的提交都用 always()。
      - name: 同步各板块兜底数据
        if: always()
        run: |
          python - <<'PY'
          import json, urllib.request
          SOURCES = [
              ("vos-data.json",          "yanjiaoo/vos-social-media", "vos-data.json"),
              ("pn15-data.json",         "yanjiaoo/pn15",             "pn15-data.json"),
              ("freight-data.json",      "yanjiaoo/freight-watch",    "freight-data.json"),
              ("freight-chart-data.json","yanjiaoo/freight-watch",    "freight-chart-data.json"),
          ]
          for dest, repo, path in SOURCES:
              url = f"https://raw.githubusercontent.com/{repo}/main/{path}"
              try:
                  data = json.loads(urllib.request.urlopen(url, timeout=30).read())
              except Exception as e:
                  # 单个源同步失败不该拖垮整条资讯流水线，保留旧文件继续
                  print(f"::warning::{dest} 同步失败，保留旧文件: {e}")
                  continue
              if not data:
                  print(f"::warning::{dest} 拉到的内容为空，保留旧文件")
                  continue
              with open(dest, "w", encoding="utf-8") as f:
                  json.dump(data, f, ensure_ascii=False, indent=2)
              n = len(data) if isinstance(data, (list, dict)) else "?"
              print(f"{dest} 已同步 ({n})")
          PY

      - name: Commit and Push
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add news-data.json script.js vos-data.json pn15-data.json freight-data.json freight-chart-data.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            if git diff --staged --name-only | grep -q '^script\.js$'; then
              echo "script.js 有更新（上站内容已变化）"
            else
              echo "::warning::只有 news-data.json 变化，script.js 未更新 —— 页面内容本次没变"
            fi
            git commit -m "auto: 更新竞对资讯 $(date +%Y-%m-%d)"
            git push
          fi

      # 这次事故的根本教训：每天都有 commit，但 commit 里只有 news-data.json（RSS 原始
      # 素材天天自然变化），真正上站的 script.js 已经 20 天没动，而 job 一直是绿的。
      # 所以这里不看「有没有 commit」，直接看页面上最新一条资讯有多旧。
      - name: 检查上站内容新鲜度
        run: |
          python - <<'PY'
          import re, sys
          from datetime import date
          src = open('script.js', encoding='utf-8').read()
          dates = sorted(re.findall(r'new Date\("(\d{4}-\d{2}-\d{2})"', src))
          if not dates:
              print("::error::script.js 里解析不到任何资讯日期")
              sys.exit(1)
          newest = date.fromisoformat(dates[-1])
          lag = (date.today() - newest).days
          print(f"script.js 共 {len(dates)} 条资讯，最新一条 {newest}，滞后 {lag} 天")
          LIMIT = 4   # 去重较激进，正常也可能隔一两天才有新内容，留出余量
          if lag > LIMIT:
              print(f"::error::上站资讯已滞后 {lag} 天（阈值 {LIMIT}），"
                    f"流水线产不出新内容，请检查 DeepSeek 余额与本 job 日志")
              sys.exit(1)
          PY
